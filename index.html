<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ede9e0" />
    <title>Ma Maison — Webportrait</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <audio id="musique-fond" loop preload="none">
  <source src="assets/sounds/chilllofi.mp3" type="audio/mpeg">
</audio>

<button id="bouton-musique" type="button"
  style="position:fixed; top:20px; right:20px; z-index:10;">
  ▶ Musique
</button>

<script>
  const musique = document.getElementById("musique-fond");
  const bouton = document.getElementById("bouton-musique");
  let premierClic = true;

  musique.volume = 0.15;

  async function lancerMusique() {
    try {
      await musique.play();
    } catch {
      // Le bouton permet de réessayer si la lecture est bloquée.
    }
  }

  document.addEventListener("click", (event) => {
    if (!premierClic || bouton.contains(event.target)) return;
    premierClic = false;
    lancerMusique();
  });

  bouton.addEventListener("click", () => {
    premierClic = false;

    if (musique.paused) {
      lancerMusique();
    } else {
      musique.pause();
    }
  });

  musique.addEventListener("play", () => {
    bouton.textContent = "⏸ Musique";
  });

  musique.addEventListener("pause", () => {
    bouton.textContent = "▶ Musique";
  });
</script>
  <body>
    <header>
      <p class="eyebrow">WEBPORTRAIT</p>
      <h1>Yaël LEJEUNE--RENARD</h1>
      <p>Cliquer sur une pièce pour me decouvrir</p>
    </header>
    <main id="stage" aria-label="Maison en coupe interactive">
      <canvas
        id="scene"
        aria-label="Maison 3D. Utilise les boutons des pièces pour naviguer au clavier."
      ></canvas>
      <div id="labels" aria-label="Pièces de la maison"></div>
    </main>
    <div class="toolbar">
      <p id="status" role="status" aria-live="polite">Vue générale</p>
      <button id="reset" type="button" disabled>↖ Vue générale</button>
    </div>
    <footer>
      Échap pour revenir a la vue globale
    </footer>
    <div id="object-tip" role="tooltip" hidden></div>
    <div id="object-shortcuts" aria-label="Objets de la pièce" hidden></div>
    <dialog id="object-panel" aria-labelledby="object-title">
      <button type="button" data-close aria-label="Fermer le panneau">×</button>
      <p class="eyebrow">OBJET INTERACTIF</p>
      <h2 id="object-title" data-title></h2>
      <img data-image alt="" hidden />
      <p data-text></p>
      <div class="panel-actions">
        <button type="button" data-action hidden></button
        ><button type="button" data-audio hidden>Écouter</button>
      </div>
      <p data-feedback role="status"></p>
    </dialog>
    <div id="message" role="alert">Chargement de la maison…</div>
    <noscript>Active JavaScript pour afficher la maison.</noscript>
    <script type="module" src="js/bootstrap.js"></script>
  </body>
</html>
